name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Version tag to create (e.g. v0.1.0)"

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            compress: false
          - target: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ""
            compress: false
          - target: linux-x64
            goos: linux
            goarch: amd64
            ext: ""
            compress: true
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            compress: true
          - target: windows-x64
            goos: windows
            goarch: amd64
            ext: ".exe"
            compress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          BIN="dist/tuichat-${{ matrix.target }}${{ matrix.ext }}"
          go build \
            -ldflags="-s -w -X github.com/photon-hq/tuichat/internal/version.Version=${VERSION}" \
            -trimpath \
            -o "$BIN" \
            ./cmd/tuichat
          ls -lh "$BIN"

      - name: Install UPX
        if: matrix.compress
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Compress (UPX)
        if: matrix.compress
        run: |
          BIN="dist/tuichat-${{ matrix.target }}${{ matrix.ext }}"
          upx --best --lzma "$BIN"
          ls -lh "$BIN"

      - name: Smoke test (native targets only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          BIN="dist/tuichat-${{ matrix.target }}${{ matrix.ext }}"
          chmod +x "$BIN"
          "$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuichat-${{ matrix.target }}
          path: dist/tuichat-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check for App credentials
        id: has-app
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate App Token
        id: app-token
        if: steps.has-app.outputs.present == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          shasum -a 256 tuichat-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          # If invoked via workflow_dispatch, create the tag now so the release has something to point at.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              tuichat-* SHA256SUMS
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              tuichat-* SHA256SUMS
          fi
