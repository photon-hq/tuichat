name: Release

on:
  pull_request:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: true
        description: "Force a release"
      prerelease:
        type: boolean
        default: false
        description: "Publish as a prerelease (npm tag: beta)"
      dry-run:
        type: boolean
        default: false
        description: "Dry run (no actual publish)"

jobs:
  release:
    uses: photon-hq/buildspace/.github/workflows/typescript-monorepo-release.yaml@main
    with:
      service-name: tuichat
      packages: '[{"name":"@photon-ai/tuichat","path":"packages/tuichat"},{"name":"@photon-ai/tuichat-spectrum-ts","path":"packages/tuichat-spectrum-ts"}]'
      release: ${{ inputs.release || false }}
      prerelease: ${{ inputs.prerelease || false }}
      dry-run: ${{ inputs.dry-run || false }}
      include-dependents: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
